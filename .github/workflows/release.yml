# Builds the Windows installer and publishes the GitHub release when a vX.Y.Z tag is pushed
# (`npm run release` creates and pushes that tag). CV releases created by the app use
# `cv-…` tags: they do not match the pattern below and never start this workflow.
name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Runs the repository's code (dependencies, checks, build) without any write access.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      # The tag must match package.json and point to a commit of main.
      - id: version
        name: Check the tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::Tag $TAG_VERSION does not match package.json $PKG_VERSION"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tag does not point to a commit of main"; exit 1; }
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run check
      - run: npm test

      # Release notes: fails if the entry is missing from CHANGELOG.md or CHANGELOG.fr.md.
      - name: Release notes
        run: node scripts/changelog-notes.mjs ${{ steps.version.outputs.version }} release-notes.md

      # NSIS installer + blockmap + latest.yml (read by electron-updater).
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Check latest.yml
        shell: bash
        run: |
          grep -q "version: ${{ steps.version.outputs.version }}" dist/latest.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/CV-Studio-Setup-${{ steps.version.outputs.version }}.exe
            dist/CV-Studio-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  # The only job allowed to write; it does not run any code from the repository.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Downloaded files
        run: find release -type f -exec ls -l {} +
      # Created as a draft, then published only once the three files are uploaded:
      # installed apps never see an incomplete release.
      - name: Publish the release
        run: |
          gh release create "$TAG" release/dist/* --draft --verify-tag \
            --title "CV Studio $VERSION" --notes-file release/release-notes.md
          gh release edit "$TAG" --draft=false --latest
      # The three files must be there and not empty.
      - name: Check the release
        run: |
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | tee assets.txt
          for f in "CV-Studio-Setup-$VERSION.exe" "CV-Studio-Setup-$VERSION.exe.blockmap" latest.yml; do
            grep -q "^$f [1-9]" assets.txt || { echo "::error::$f is missing or empty"; exit 1; }
          done
